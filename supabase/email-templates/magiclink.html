<!-- CLM Electronics — Magic Link (optional, not used for admin but branded for consistency)
  Dashboard: Authentication → Email Templates → Magic Link
  Subject: Your CLM Admin sign-in link
-->
<div style="margin:0;padding:0;background-color:#f1f5f9;">
  <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background-color:#f1f5f9;padding:24px 0;">
    <tr><td align="center">
      <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="600" style="max-width:600px;background:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e2e8f0;">
        <tr><td style="background:#0B1D33;padding:20px 28px;">
          <div style="font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:800;color:#ffffff;">CLM Electronics Engineering Services</div>
          <div style="font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#94a3b8;margin-top:4px;letter-spacing:0.4px;text-transform:uppercase;">Sign-in Link</div>
        </td></tr>
        <tr><td style="padding:28px;">
          <h1 style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:20px;color:#0B1D33;">Sign in to CLM Admin</h1>
          <p style="margin:12px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#334155;">Click below to sign in as <strong>{{ .Email }}</strong>.</p>
          <div style="text-align:center;margin:24px 0;">
            <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#0B1D33;color:#ffffff;text-decoration:none;font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:700;padding:12px 28px;border-radius:8px;">Sign In to CLM</a>
          </div>
          <p style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#64748b;word-break:break-all;"><a href="{{ .ConfirmationURL }}" style="color:#0B1D33;">{{ .ConfirmationURL }}</a></p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</div>
